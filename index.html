<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PSLE English Paper 2 - 100 Question Prep</title>
    <style>
        :root { --p: #3182ce; --s: #2d3748; --bg: #f7fafc; --white: #ffffff; }
        body { font-family: 'Inter', system-ui, sans-serif; background: var(--bg); margin: 0; padding: 10px; display: flex; justify-content: center; }
        .quiz-card { width: 100%; max-width: 500px; background: var(--white); padding: 20px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); margin-top: 10px; }
        .header { text-align: center; border-bottom: 2px solid #edf2f7; padding-bottom: 15px; margin-bottom: 20px; }
        .prog-bg { height: 6px; background: #edf2f7; border-radius: 3px; margin-bottom: 20px; }
        .prog-fill { height: 100%; background: var(--p); width: 0%; transition: 0.4s; }
        .cat-tag { font-size: 0.75rem; font-weight: 700; color: var(--p); text-transform: uppercase; background: #ebf8ff; padding: 4px 10px; border-radius: 10px; }
        .q-text { font-size: 1.1rem; font-weight: 600; margin: 20px 0; line-height: 1.5; color: var(--s); }
        .opt-grid { display: flex; flex-direction: column; gap: 10px; }
        .opt-btn { padding: 15px; border: 2px solid #edf2f7; border-radius: 12px; background: white; text-align: left; cursor: pointer; font-size: 1rem; transition: 0.2s; }
        .opt-btn.selected { border-color: var(--p); background: #ebf8ff; color: var(--p); font-weight: 600; }
        .feedback { margin-top: 15px; padding: 15px; border-radius: 12px; display: none; font-size: 0.9rem; line-height: 1.4; border: 1px solid transparent; }
        .feedback.correct { display: block; background: #f0fff4; color: #22543d; border-color: #c6f6d5; }
        .feedback.wrong { display: block; background: #fff5f5; color: #822727; border-color: #fed7d7; }
        .btn-group { margin-top: 20px; }
        button.main-btn { width: 100%; padding: 16px; border-radius: 12px; border: none; font-weight: bold; font-size: 1rem; cursor: pointer; transition: 0.2s; }
        .confirm { background: var(--s); color: white; }
        .confirm:disabled { opacity: 0.3; cursor: not-allowed; }
        .next { background: var(--p); color: white; display: none; }
        .result-screen { display: none; text-align: center; }
        .score-circle { font-size: 3.5rem; font-weight: 900; color: var(--p); margin: 20px 0; }
        .review-list { text-align: left; margin-top: 20px; max-height: 300px; overflow-y: auto; background: #fdfdfd; border-radius: 10px; padding: 10px; }
        .review-item { padding: 10px; border-bottom: 1px solid #edf2f7; font-size: 0.85rem; }
    </style>
</head>
<body>

<div class="quiz-card">
    <div id="quiz-ui">
        <div class="header">
            <h3 style="margin:0">PSLE English Mastery</h3>
            <p id="q-counter" style="color:#718096; font-size:0.8rem; margin:5px 0 0 0;">Bitesize Session (10 Qns)</p>
        </div>
        <div class="prog-bg"><div class="prog-fill" id="prog-bar"></div></div>

        <div id="question-area">
            <span class="cat-tag" id="q-cat"></span>
            <div class="q-text" id="q-text"></div>
            <div class="opt-grid" id="opt-grid"></div>
            <div id="feedback" class="feedback"></div>
            <div class="btn-group">
                <button id="btn-confirm" class="main-btn confirm" disabled onclick="confirmAnswer()">Confirm Answer</button>
                <button id="btn-next" class="main-btn next" onclick="nextQuestion()">Next Question</button>
            </div>
        </div>
    </div>

    <div id="result-ui" class="result-screen">
        <h2>Session Complete!</h2>
        <div class="score-circle" id="final-score">0/10</div>
        <p id="result-msg">Keep it up!</p>
        <button class="main-btn confirm" onclick="generateNewSet()">Generate Next 10 Questions</button>
        <div class="review-list" id="review-list"></div>
    </div>
</div>

<script>
    // --- QUESTION DATABASE ---
    // You can easily add more here following the format.
    const fullBank = [
        { "category": "SVA", "question": "The pack of wolves ________ seen roaming near the village last night.", "options": ["is", "are", "was", "were"], "correctIdx": 2, "explanation": "'Pack' is a singular collective noun. 'Last night' indicates past tense." },
        { "category": "Question Tags", "question": "You have never been to Japan, ________?", "options": ["haven't you", "have you", "did you", "don't you"], "correctIdx": 1, "explanation": "'Never' is negative, so the tag must be positive ('have you')." },
        { "category": "Reported Speech", "question": "Choose the correct rewrite: 'I am busy now,' said May.", "options": ["May said she is busy now.", "May said she was busy then.", "May said she was busy now.", "May said she is busy then."], "correctIdx": 1, "explanation": "'Am' changes to 'was', and 'now' changes to 'then'." },
        { "category": "Vocab MCQ", "question": "The police are ________ the cause of the mysterious fire.", "options": ["looking into", "looking after", "looking up", "looking out"], "correctIdx": 0, "explanation": "'Looking into' means to investigate." },
        { "category": "Conditionals", "question": "________ I known it was your birthday, I would have bought a gift.", "options": ["Should", "Had", "Could", "Would"], "correctIdx": 1, "explanation": "'Had I known' is formal for 'If I had known'." },
        { "category": "Connectors", "question": "He finished the race ________ being injured.", "options": ["unless", "despite", "although", "since"], "correctIdx": 1, "explanation": "'Despite' is followed by a gerund (being) or noun." },
        { "category": "SVA", "question": "The manager, as well as his staff, ________ attending the meeting.", "options": ["is", "are", "were", "have been"], "correctIdx": 0, "explanation": "'As well as' is an interrupter; the verb agrees with 'manager'." },
        { "category": "Question Tags", "question": "There is hardly any food left, ________?", "options": ["isn't there", "is there", "wasn't there", "was there"], "correctIdx": 1, "explanation": "'Hardly' is negative, so the tag is positive." },
        { "category": "Nominalization", "question": "The ________ of the bridge took several years.", "options": ["construct", "constructed", "construction", "constructive"], "correctIdx": 2, "explanation": "The noun form 'construction' is required after 'The'." },
        { "category": "Vocab MCQ", "question": "The match was ________ due to the thunderstorm.", "options": ["called off", "called out", "called on", "called for"], "correctIdx": 0, "explanation": "'Called off' means cancelled." },
        { "category": "SVA", "question": "Neither the teacher nor the students ________ the answer.", "options": ["know", "knows", "knowing", "is knowing"], "correctIdx": 0, "explanation": "With 'Neither/Nor', verb follows the closer subject (students - plural)." },
        { "category": "Prepositions", "question": "The girl was congratulated ________ her success.", "options": ["for", "at", "on", "with"], "correctIdx": 2, "explanation": "We congratulate someone 'on' something." },
        { "category": "Pronouns", "question": "This is the boy ________ father won the lottery.", "options": ["who", "whom", "whose", "which"], "correctIdx": 2, "explanation": "'Whose' shows possession." },
        { "category": "SVA", "question": "Each of the apples ________ rotten.", "options": ["is", "are", "were", "have been"], "correctIdx": 0, "explanation": "'Each' is always singular." },
        { "category": "Vocabulary", "question": "The detective found the story ________.", "options": ["plausible", "plausibly", "plausibility", "plausibles"], "correctIdx": 0, "explanation": "Adjective 'plausible' (believable) is needed." },
        { "category": "Question Tags", "question": "Let's go, ________?", "options": ["shall we", "won't we", "can we", "don't we"], "correctIdx": 0, "explanation": "'Let's' suggestions always take 'shall we'." },
        { "category": "Conditionals", "question": "________ you see him, tell him to call me.", "options": ["Could", "Should", "Would", "Might"], "correctIdx": 1, "explanation": "'Should you' is a formal way of saying 'If you'." },
        { "category": "Vocab MCQ", "question": "He had to ________ his pride and apologize.", "options": ["eat", "swallow", "digest", "taste"], "correctIdx": 1, "explanation": "Idiom: 'Swallow one's pride'." },
        { "category": "SVA", "question": "A number of students ________ absent today.", "options": ["is", "are", "was", "has been"], "correctIdx": 1, "explanation": "'A number of' is plural. ('The number of' is singular)." },
        { "category": "Synthesis", "question": "He is poor ________ he is honest.", "options": ["yet", "so", "since", "because"], "correctIdx": 0, "explanation": "'Yet' shows contrast (poor vs honest)." },
        { "category": "SVA", "question": "One of the boys, along with his cousins, ________ to the park every Saturday morning.", "options": ["go", "goes", "gone", "going"], "correctIdx": 1, "explanation": "The subject is 'One', which is singular. 'Along with his cousins' is an interrupter." },
        { "category": "SVA", "question": "The furniture in this showroom ________ on sale until the end of the month.", "options": ["is", "are", "were", "have been"], "correctIdx": 0, "explanation": "'Furniture' is an uncountable noun and always takes a singular verb." },
    { "category": "Pronouns", "question": "The lady ________ you were talking to earlier is our new principal.", "options": ["who", "whom", "whose", "which"], "correctIdx": 1, "explanation": "Use 'whom' as the object pronoun (you were talking to *her*)." },
    { "category": "SVA", "question": "Neither of the two candidates ________ qualified for the job.", "options": ["is", "are", "were", "have been"], "correctIdx": 0, "explanation": "'Neither' refers to 'not one and not the other', making it singular." },
        { "category": "Pronouns", "question": "The children enjoyed ________ at the party yesterday.", "options": ["themselves", "himself", "herself", "ourselves"], "correctIdx": 0, "explanation": "'Children' is plural, so the reflexive pronoun must be 'themselves'." },
    { "category": "SVA", "question": "Bread and butter ________ my brother's favorite breakfast.", "options": ["is", "are", "were", "have been"], "correctIdx": 0, "explanation": "When two nouns represent a single idea or entity, they take a singular verb." },
    { "category": "SVA", "question": "Many a student ________ fallen for the trick question in the exam.", "options": ["has", "have", "is", "are"], "correctIdx": 0, "explanation": "The expression 'Many a' is always followed by a singular noun and a singular verb." },
    { "category": "SVA", "question": "The information provided in the brochures ________ inaccurate.", "options": ["is", "are", "were", "have been"], "correctIdx": 0, "explanation": "'Information' is uncountable and singular." },
    { "category": "Pronouns", "question": "Between you and ________, I think the plan will fail.", "options": ["I", "me", "my", "mine"], "correctIdx": 1, "explanation": "'Between' is a preposition; it must be followed by the object pronoun 'me'." },
    { "category": "SVA", "question": "Ten kilometers ________ a long distance to run for a beginner.", "options": ["is", "are", "were", "have been"], "correctIdx": 0, "explanation": "Measurements of distance/time are treated as a single unit (singular)." },
        // QUESTION TAGS (31-40)
    { "category": "Question Tags", "question": "I am the winner of the competition, ________?", "options": ["am not I", "aren't I", "am I", "isn't it"], "correctIdx": 1, "explanation": "The tag for 'I am' is always 'aren't I'." },
    { "category": "Question Tags", "question": "Help yourself to the food, ________?", "options": ["can you", "will you", "shall we", "don't you"], "correctIdx": 1, "explanation": "For imperatives (commands/requests), the tag is usually 'will you'." },
    { "category": "Question Tags", "question": "Nothing went wrong during the performance, ________?", "options": ["did it", "didn't it", "was it", "wasn't it"], "correctIdx": 0, "explanation": "'Nothing' is negative, so the tag is positive. 'Nothing' takes the pronoun 'it'." },
    { "category": "Question Tags", "question": "You'd rather stay home tonight, ________?", "options": ["hadn't you", "wouldn't you", "didn't you", "won't you"], "correctIdx": 1, "explanation": "In 'You'd rather', 'd' stands for 'would'. The tag is 'wouldn't you'." },
    { "category": "Question Tags", "question": "He's finished his homework, ________?", "options": ["isn't he", "hasn't he", "is he", "has he"], "correctIdx": 1, "explanation": "Here, 'He's' stands for 'He has' (present perfect). Tag is 'hasn't he'." },
    { "category": "Question Tags", "question": "Nobody was late for the meeting, ________?", "options": ["was he", "were they", "wasn't he", "weren't they"], "correctIdx": 1, "explanation": "'Nobody' is negative and takes the plural pronoun 'they'. Use 'were they'." },
    { "category": "Question Tags", "question": "There's a lot of traffic today, ________?", "options": ["isn't there", "is there", "isn't it", "is it"], "correctIdx": 0, "explanation": "When 'There' is used as the subject, it is repeated in the tag." },
    { "category": "Question Tags", "question": "He seldom goes to the gym, ________?", "options": ["does he", "doesn't he", "is he", "isn't he"], "correctIdx": 0, "explanation": "'Seldom' is a negative word; it requires a positive tag." },
    { "category": "Question Tags", "question": "You'd been there before, ________?", "options": ["hadn't you", "wouldn't you", "didn't you", "weren't you"], "correctIdx": 0, "explanation": "In 'You'd been', 'd' stands for 'had' (past perfect). Tag is 'hadn't you'." },
    { "category": "Question Tags", "question": "That's your bag, ________?", "options": ["isn't it", "isn't that", "is it", "is that"], "correctIdx": 0, "explanation": "For 'That' or 'This', the tag uses the pronoun 'it'." },

    // VOCABULARY & PHRASAL VERBS (41-60)
    { "category": "Vocab MCQ", "question": "The detective could not ________ what the suspect was trying to say.", "options": ["make up", "make out", "make off", "make for"], "correctIdx": 1, "explanation": "'Make out' means to understand or decipher something unclear." },
    { "category": "Vocab MCQ", "question": "The new law ________ significant changes in the education system.", "options": ["brought about", "brought up", "brought out", "brought along"], "correctIdx": 0, "explanation": "'Brought about' means to cause something to happen." },
    { "category": "Vocab MCQ", "question": "She ________ her mother in both appearance and personality.", "options": ["takes after", "takes on", "takes up", "takes in"], "correctIdx": 0, "explanation": "'Takes after' means to resemble an older relative." },
    { "category": "Vocab MCQ", "question": "We must ________ the costs before we decide to buy the house.", "options": ["account for", "look into", "count on", "bear with"], "correctIdx": 1, "explanation": "'Look into' means to investigate or examine." },
    { "category": "Vocab MCQ", "question": "I ________ an old friend while I was shopping yesterday.", "options": ["ran into", "ran over", "ran out", "ran for"], "correctIdx": 0, "explanation": "'Ran into' means to meet someone unexpectedly." },
    { "category": "Vocab MCQ", "question": "The smell of the ocean ________ memories of my childhood holidays.", "options": ["called up", "called off", "called out", "called for"], "correctIdx": 0, "explanation": "'Called up' means to evoke or bring back to mind." },
    { "category": "Vocab MCQ", "question": "You should not ________ your classmates just because you are better at sports.", "options": ["look down on", "look up to", "look out for", "look into"], "correctIdx": 0, "explanation": "'Look down on' means to feel superior to someone." },
    { "category": "Vocab MCQ", "question": "The thief ________ the stolen jewels before the police arrived.", "options": ["made up with", "made off with", "made out with", "made for"], "correctIdx": 1, "explanation": "'Made off with' means to steal and escape with something." },
    { "category": "Vocab MCQ", "question": "I can no longer ________ his constant complaining.", "options": ["put up with", "put out with", "put off with", "put down with"], "correctIdx": 0, "explanation": "'Put up with' means to tolerate." },
    { "category": "Vocab MCQ", "question": "The fire ________ in the middle of the night.", "options": ["broke out", "broke up", "broke down", "broke through"], "correctIdx": 0, "explanation": "'Broke out' is used for the sudden start of fire, war, or disease." },
    { "category": "Vocab MCQ", "question": "She had to ________ her speech because the time was limited.", "options": ["cut down", "cut off", "cut out", "cut short"], "correctIdx": 3, "explanation": "'Cut short' means to end something earlier than planned." },
    { "category": "Vocab MCQ", "question": "The plane ________ exactly on time despite the heavy rain.", "options": ["took off", "took up", "took in", "took over"], "correctIdx": 0, "explanation": "'Took off' refers to an aircraft leaving the ground." },
    { "category": "Vocab MCQ", "question": "He ________ the business after his father retired.", "options": ["took over", "took on", "took up", "took out"], "correctIdx": 0, "explanation": "'Took over' means to take control of something." },
    { "category": "Vocab MCQ", "question": "The wet weather ________ my plans for a picnic.", "options": ["fell through", "fell out", "fell off", "fell behind"], "correctIdx": 0, "explanation": "'Fell through' means a plan or deal failed to happen." },
    { "category": "Vocab MCQ", "question": "You should ________ the offer before it's too late.", "options": ["take up", "take on", "take in", "take out"], "correctIdx": 0, "explanation": "'Take up' means to accept an offer or challenge." },
    { "category": "Vocab MCQ", "question": "The teacher ________ the main points of the lesson at the end.", "options": ["went over", "went through", "went off", "went up"], "correctIdx": 0, "explanation": "'Went over' means to review or repeat." },
    { "category": "Vocab MCQ", "question": "His performance ________ our expectations.", "options": ["lived up to", "lived on", "lived out", "lived through"], "correctIdx": 0, "explanation": "'Lived up to' means to be as good as expected." },
    { "category": "Vocab MCQ", "question": "The battery has ________, so the toy no longer works.", "options": ["run out", "run over", "run through", "run off"], "correctIdx": 0, "explanation": "'Run out' means to have no more of something left." },
    { "category": "Vocab MCQ", "question": "She ________ a brilliant idea for the school project.", "options": ["came up with", "came across", "came about", "came through"], "correctIdx": 0, "explanation": "'Came up with' means to think of an idea or plan." },
    { "category": "Vocab MCQ", "question": "The doctor told him to ________ smoking for the sake of his health.", "options": ["give up", "give in", "give out", "give away"], "correctIdx": 0, "explanation": "'Give up' means to quit a habit." },

    // SYNTHESIS & TRANSFORMATION PATTERNS (61-85)
    { "category": "Conditionals", "question": "________ you need any help, please do not hesitate to ask.", "options": ["Should", "Had", "Would", "Could"], "correctIdx": 0, "explanation": "'Should you' is the formal way of saying 'If you'." },
    { "category": "Conditionals", "question": "________ it not been for his help, I would have failed.", "options": ["Had", "Should", "Were", "Would"], "correctIdx": 0, "explanation": "'Had it not been for' is used to talk about something that changed the outcome." },
    { "category": "Synthesis", "question": "Much to my ________, my favorite team lost the match.", "options": ["disappoint", "disappointed", "disappointing", "disappointment"], "correctIdx": 3, "explanation": "The phrase 'Much to my...' must be followed by a noun." },
    { "category": "Synthesis", "question": "Lest he ________ late, he took a taxi to the airport.", "options": ["is", "was", "be", "were"], "correctIdx": 2, "explanation": "'Lest' is followed by the base form of the verb (subjunctive mood)." },
    { "category": "Connectors", "question": "In spite of ________ ill, he went to work.", "options": ["be", "being", "been", "was"], "correctIdx": 1, "explanation": "'In spite of' is a prepositional phrase; it must be followed by a gerund (-ing)." },
    { "category": "Connectors", "question": "Scarcely had I reached home ________ it started to pour.", "options": ["than", "when", "then", "since"], "correctIdx": 1, "explanation": "The correct correlative pair is 'Scarcely... when'." },
    { "category": "Connectors", "question": "No sooner had he left ________ the phone rang.", "options": ["than", "when", "then", "since"], "correctIdx": 0, "explanation": "The correct correlative pair is 'No sooner... than'." },
    { "category": "Reported Speech", "question": "Mother asked me ________ I had finished my homework.", "options": ["that", "if", "weather", "which"], "correctIdx": 1, "explanation": "For Yes/No questions in reported speech, use 'if' or 'whether'." },
    { "category": "Prepositions", "question": "He was acquitted ________ all charges by the court.", "options": ["of", "from", "with", "for"], "correctIdx": 0, "explanation": "One is 'acquitted of' a crime." },
    { "category": "Prepositions", "question": "The success of the project is dependent ________ your cooperation.", "options": ["with", "on", "at", "to"], "correctIdx": 1, "explanation": "The fixed preposition for 'dependent' is 'on'." },
    { "category": "Prepositions", "question": "The children were deprived ________ sleep during the camp.", "options": ["from", "of", "off", "with"], "correctIdx": 1, "explanation": "The fixed preposition for 'deprived' is 'of'." },
    { "category": "Prepositions", "question": "He has a great talent ________ playing the piano.", "options": ["at", "for", "in", "with"], "correctIdx": 1, "explanation": "One has a 'talent for' something." },
    { "category": "Prepositions", "question": "The teacher had a deep insight ________ the student's problems.", "options": ["to", "for", "into", "on"], "correctIdx": 2, "explanation": "One has an 'insight into' a situation." },
    { "category": "Prepositions", "question": "You must conform ________ the rules of the school.", "options": ["to", "with", "by", "on"], "correctIdx": 0, "explanation": "The fixed preposition for 'conform' is 'to'." },
    { "category": "Synthesis", "question": "Provided ________ you study hard, you will pass.", "options": ["that", "since", "unless", "whether"], "correctIdx": 0, "explanation": "'Provided that' means 'if' or 'on the condition that'." },
    { "category": "Nominalization", "question": "The ________ of the new park was celebrated by everyone.", "options": ["open", "opened", "opening", "openness"], "correctIdx": 2, "explanation": "'The opening' acts as the noun subject here." },
    { "category": "Nominalization", "question": "His ________ to help the old lady was commendable.", "options": ["eager", "eagerly", "eagerness", "eagered"], "correctIdx": 2, "explanation": "The noun form of 'eager' is 'eagerness'." },
    { "category": "Nominalization", "question": "The ________ of the experiment was a surprise to all.", "options": ["fail", "failed", "failure", "failing"], "correctIdx": 2, "explanation": "The noun form of 'fail' is 'failure'." },
    { "category": "Synthesis", "question": "Hardly ________ anyone in the room when I arrived.", "options": ["was there", "there was", "is there", "there is"], "correctIdx": 0, "explanation": "When 'Hardly' starts a sentence, inversion occurs (verb before subject)." },
    { "category": "Synthesis", "question": "So ________ was the noise that I could not sleep.", "options": ["loud", "loudly", "loudness", "louder"], "correctIdx": 0, "explanation": "Use the adjective 'loud' after 'So' in this structure." },
    { "category": "Synthesis", "question": "Small ________ it is, the diamond is very expensive.", "options": ["as", "though", "since", "while"], "correctIdx": 0, "explanation": "The structure '[Adj] + as + [Subject] + [Verb]' shows contrast." },
    { "category": "Synthesis", "question": "The ________ of his wealth is unknown to many.", "options": ["extend", "extent", "extended", "extensive"], "correctIdx": 1, "explanation": "'Extent' is the noun form meaning the size or scale of something." },
    { "category": "Reported Speech", "question": "Jane told her brother ________ play with the fire.", "options": ["to not", "not to", "do not", "did not"], "correctIdx": 1, "explanation": "In reported commands/prohibitions, use 'not to' + [base verb]." },
    { "category": "Active/Passive", "question": "Active: 'The wind blew the leaves away.' Passive: 'The leaves ________ away by the wind.'", "options": ["are blown", "were blown", "were blowing", "had blown"], "correctIdx": 1, "explanation": "'Blew' is past tense, so passive is 'were blown'." },
    { "category": "Synthesis", "question": "Neither of the children ________ allowed to go out late at night.", "options": ["is", "are", "was", "were"], "correctIdx": 2, "explanation": "'Neither' is singular; 'was' is the most appropriate past singular form." },

    // ADVANCED GRAMMAR & TRAPS (86-100)
    { "category": "Tenses", "question": "By the time the police arrived, the thief ________ away.", "options": ["ran", "has run", "had run", "was running"], "correctIdx": 2, "explanation": "Use Past Perfect (had run) for the action that happened first in the past." },
    { "category": "Tenses", "question": "Since he started his new job, he ________ very busy.", "options": ["is", "was", "has been", "had been"], "correctIdx": 2, "explanation": "'Since' signals the use of Present Perfect (has been)." },
    { "category": "Tenses", "question": "I ________ my lunch when the phone rang.", "options": ["eat", "ate", "am eating", "was eating"], "correctIdx": 3, "explanation": "Use Past Continuous for an action interrupted by a shorter action (Past Simple)." },
    { "category": "Tenses", "question": "I wish I ________ more for the exam last week.", "options": ["study", "studied", "have studied", "had studied"], "correctIdx": 3, "explanation": "Wishes about the past use the Past Perfect tense (had studied)." },

    let currentSet = [];
    let currentIdx = 0;
    let score = 0;
    let selectedIdx = null;
    let sessionHistory = [];

    function generateNewSet() {
        score = 0;
        currentIdx = 0;
        sessionHistory = [];
        
        // Randomly shuffle full bank and pick 10
        currentSet = [...fullBank].sort(() => 0.5 - Math.random()).slice(0, 10);
        
        document.getElementById('result-ui').style.display = 'none';
        document.getElementById('quiz-ui').style.display = 'block';
        showQuestion();
    }

    function showQuestion() {
        const q = currentSet[currentIdx];
        document.getElementById('q-counter').innerText = `Question ${currentIdx + 1} of 10`;
        document.getElementById('prog-bar').style.width = `${(currentIdx / 10) * 100}%`;
        document.getElementById('q-cat').innerText = q.category;
        document.getElementById('q-text').innerText = q.question;
        
        const grid = document.getElementById('opt-grid');
        grid.innerHTML = '';
        selectedIdx = null;
        
        document.getElementById('feedback').style.display = 'none';
        document.getElementById('btn-confirm').style.display = 'block';
        document.getElementById('btn-confirm').disabled = true;
        document.getElementById('btn-next').style.display = 'none';

        q.options.forEach((opt, i) => {
            const btn = document.createElement('button');
            btn.className = 'opt-btn';
            btn.innerText = opt;
            btn.onclick = () => {
                selectedIdx = i;
                document.querySelectorAll('.opt-btn').forEach(b => b.classList.remove('selected'));
                btn.classList.add('selected');
                document.getElementById('btn-confirm').disabled = false;
            };
            grid.appendChild(btn);
        });
    }

    function confirmAnswer() {
        const q = currentSet[currentIdx];
        const isCorrect = selectedIdx === q.correctIdx;
        if(isCorrect) score++;
        sessionHistory.push({ q: q.question, correct: isCorrect, ans: q.options[q.correctIdx] });

        const fb = document.getElementById('feedback');
        fb.className = `feedback ${isCorrect ? 'correct' : 'wrong'}`;
        fb.innerHTML = `<strong>${isCorrect ? 'Correct!' : 'Incorrect'}</strong><br>${q.explanation}`;
        fb.style.display = 'block';

        document.getElementById('btn-confirm').style.display = 'none';
        document.getElementById('btn-next').style.display = 'block';
        document.querySelectorAll('.opt-btn').forEach(b => b.style.pointerEvents = 'none');
    }

    function nextQuestion() {
        currentIdx++;
        if(currentIdx < 10) showQuestion();
        else showResults();
    }

    function showResults() {
        document.getElementById('quiz-ui').style.display = 'none';
        document.getElementById('result-ui').style.display = 'block';
        document.getElementById('final-score').innerText = `${score} / 10`;
        
        const list = document.getElementById('review-list');
        list.innerHTML = '<h4>Review:</h4>';
        sessionHistory.forEach((item, i) => {
            list.innerHTML += `<div class="review-item">
                <b style="color:${item.correct ? '#38a169':'#e53e3e'}">Q${i+1}:</b> ${item.q}<br>
                <small>Answer: ${item.ans}</small>
            </div>`;
        });
    }

    window.onload = generateNewSet;
</script>
